
<!doctype html>
<html lang="de">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>DailyQuest</title>

    <!-- DailyQuest App-Icon -->
    <link
      rel="icon"
      type="image/png"
      href="/dailyquest/icon-192.png"
    />

    <link

      href="/dailyquest/apple-touch-icon.png"
